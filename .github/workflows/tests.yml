name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --cov=nanonet_ml --cov-report=term-missing

      - name: Ruff check
        run: ruff check nanonet_ml tests examples benchmarks

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Clean wheel smoke install
        run: |
          python -m venv .venv-package-test
          .venv-package-test/bin/python -m pip install --upgrade pip
          .venv-package-test/bin/python -m pip install dist/*.whl
          REPO="$PWD"
          cd /tmp
          "$REPO/.venv-package-test/bin/python" -c "import nanonet_ml as nn; from importlib.metadata import version; assert nn.__version__ == version('nanonet-ml'); from nanonet_ml.data import LogDataset; print(nn.__version__, nn.__file__, LogDataset.__name__)"
          "$REPO/.venv-package-test/bin/python" "$REPO/scripts/release_smoke.py"
