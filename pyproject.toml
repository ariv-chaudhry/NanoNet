[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanonet"
version = "0.1.0"
description = "An educational neural-network framework built from scratch with Python and NumPy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NanoNet Contributors" }]
keywords = ["machine-learning", "neural-networks", "autodiff", "numpy", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "matplotlib>=3.7",
    "ruff>=0.4",
]
benchmark = [
    "torch>=2.0",
]
viz = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/nanonet/nanonet"
Documentation = "https://github.com/nanonet/nanonet/tree/main/docs"
Repository = "https://github.com/nanonet/nanonet"

[tool.setuptools.packages.find]
include = ["nanonet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["nanonet"]
omit = ["nanonet/data/mnist.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
